name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo check --locked
      - run: cargo build --locked --release

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: bash ../scripts/verify-embedded-frontend.sh

  documentation:
    name: Documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: bash ../scripts/tests/test-docs-content.sh

  system-scripts:
    name: Installer and helper checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh scripts/update-helper.sh scripts/ufw-helper.sh scripts/bump-version.sh
      - run: bash scripts/tests/test-update-helper.sh
      - run: bash scripts/tests/test-update-selection.sh
      - run: bash scripts/tests/test-ufw-helper.sh
