[package]
name = "donatello"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
if-addrs = "0.13"
libc = "0.2"
rust-embed = "8"
mime_guess = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
